# Weekly GitHub Actions updates with a 14-day release cooldown, so new releases have time
# to be pulled or yanked before they are proposed. Security updates skip the cooldown.
# Every action is pinned to a commit SHA with its version in a comment; Dependabot updates
# both together. requirements.txt (PyYAML for CI) gets the same cooldown.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
